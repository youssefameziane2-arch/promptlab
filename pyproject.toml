[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptlab"
version = "2.0.0"
description = "Controlled LLM summarization of technical documents: 5 prompting techniques, verify-and-repair loop, reproducible evaluation bench, Qt GUI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Youssef Ameziane" }]
dependencies = ["PySide6>=6.6", "python-docx>=1.1", "pypdf>=4", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5"]

[project.scripts]
promptlab = "promptlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N", "UP"]
ignore = ["N802"]
